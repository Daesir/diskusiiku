name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      -- name: Siapkan folder www
        run: |
          mkdir www
          rsync -a --exclude='.git' --exclude='.github' --exclude='www' --exclude='README.md' ./ www/
          ls -R www | head -60
      - name: Pasang Capacitor
        run: |
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "Sidang Nalar" io.github.daesir.sidangnalar --web-dir=www
          npx cap add android
          npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sidang-nalar-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
